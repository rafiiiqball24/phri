image: alpine:3.18

variables:
  DEPLOY_PATH: "/www/wwwroot/backoffice-phri-skka.can.co.id"

stages:
  - deploy

deploy:
  stage: deploy

  before_script:
    - echo "=== Setting up deployment environment ==="
    - echo "Installing required packages..."
    - apk add --no-cache bash openssh rsync

    # Buat direktori SSH
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    # Validasi variabel
    - >-
      bash -c '
      for var in SSH_PRIVATE_KEY SSH_USERNAME PRODUCTION_SERVER PORT; do
        eval val=\$$var
        if [ -z "$val" ]; then
          echo "ERROR: $var variable is not set in GitLab CI/CD settings"
          exit 1
        fi
      done
      '

    # Setup SSH key
    - echo "$SSH_PRIVATE_KEY" | tr -d "\r" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519

    # Start SSH agent
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_ed25519

    # Buat config SSH
    - >-
      bash -c '
      cat > ~/.ssh/config << EOF
Host production
  HostName $PRODUCTION_SERVER
  User $SSH_USERNAME
  Port $PORT
  IdentityFile ~/.ssh/id_ed25519
  StrictHostKeyChecking no
  UserKnownHostsFile /dev/null
  LogLevel ERROR
  ServerAliveInterval 60
  ServerAliveCountMax 3
EOF
      chmod 600 ~/.ssh/config
      '

    # Test SSH connection
    - ssh -o ConnectTimeout=10 production "echo 'SSH connection successful to $PRODUCTION_SERVER'"

  script:
    - echo "=== Starting deployment process ==="
    - ssh production "ls -lah $DEPLOY_PATH"
    - >-
      bash -c '
      ssh production "
        set -e
        export PORT=$PORT
        export NODE_ENV=production
        export CI_COMMIT_SHA=$CI_COMMIT_SHA
        export CI_COMMIT_REF_NAME=$CI_COMMIT_REF_NAME
        cd $DEPLOY_PATH
        echo Current directory: \$(pwd)
        echo PORT= \$PORT
        echo NODE_ENV= \$NODE_ENV
        echo Running deploy.sh...
        bash ./deploy.sh
      "
      '
    - echo "=== Deployment completed successfully ==="

  after_script:
    - echo "=== Cleaning up SSH keys ==="
    - rm -f ~/.ssh/id_ed25519
    - rm -f ~/.ssh/config
    - killall ssh-agent 2>/dev/null || true
    - echo "Cleanup completed"

  only:
    - main

  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

  timeout: 15m
