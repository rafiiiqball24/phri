stages:
  - build
  - deploy

variables:
  NODE_ENV: production
  APP_PATH: $APP_PATH
  VITE_APP_BASE_URL: $VITE_APP_BASE_URL
  VITE_APP_API_KEY: $VITE_APP_API_KEY

build:
  stage: build
  image: oven/bun:latest
  only:
    - main
  script:
    - echo "Building application..."
    - echo "VITE_APP_BASE_URL=$VITE_APP_BASE_URL" > .env
    - echo "VITE_APP_API_KEY=$VITE_APP_API_KEY" >> .env
    - bun install
    - bun run build
  artifacts:
    paths:
      - .output/
      - .nuxt/
      - dist/
      - bun.lockb
      - .env
    expire_in: 1 week
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

deploy:
  stage: deploy
  image: alpine:latest
  only:
    - main
  dependencies:
    - build
  before_script:
    - echo "=== Setting up deployment environment ==="
    - apk add --no-cache openssh-client rsync bash
    
    # Create SSH directory
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    
    # Validate required variables
    - |
      for var in SSH_PRIVATE_KEY SSH_USER SSH_HOST SSH_PORT APP_PATH; do
        eval val=\$$var
        if [ -z "$val" ]; then
          echo "ERROR: $var is not set"
          exit 1
        fi
      done
    
    # Setup SSH key
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    
    # Add server to known_hosts
    - ssh-keyscan -p $SSH_PORT -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
    
    # Test SSH connection
    - ssh -p $SSH_PORT -o ConnectTimeout=10 $SSH_USER@$SSH_HOST "echo 'SSH connection successful'"

  script:
    - echo "=== Deploying to production server ==="
    
    # Sync files to server
    - |
      rsync -avz --delete \
        -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=no" \
        --exclude 'node_modules' \
        --exclude '.git' \
        --exclude '.gitignore' \
        --exclude 'README.md' \
        ./ $SSH_USER@$SSH_HOST:$APP_PATH/
    
    # Run deployment commands on server
    - |
      ssh -p $SSH_PORT $SSH_USER@$SSH_HOST << 'ENDSSH'
        set -e
        cd $APP_PATH
        
        echo "Installing dependencies..."
        /root/.bun/bin/bun install --production
        
        echo "Reloading PM2..."
        pm2 reload ecosystem.config.cjs --env production || pm2 start ecosystem.config.cjs --env production
        
        echo "Deployment completed successfully!"
      ENDSSH

  after_script:
    - echo "=== Cleaning up ==="
    - rm -f ~/.ssh/id_rsa
    - rm -f ~/.ssh/known_hosts

  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

  timeout: 15m